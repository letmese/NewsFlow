plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.newsaggregator'
    compileSdk 35

    defaultConfig {
        applicationId "com.newsaggregator"
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName "4.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Jetpack Compose (BOM-managed) - v4.2.0 is pure Compose, no XML UI
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Glassmorphism: Haze real-time backdrop blur for chrome surfaces (scrim fallback < API 31)
    implementation 'dev.chrisbanes.haze:haze:1.6.5'

    // Image loading for article thumbnails (Compose-native, replaces Picasso)
    implementation 'io.coil-kt:coil-compose:2.6.0'
}
